[package]
name = "bdd-rust-multiprotocol-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }

axum = "0.8"
tower = "0.4"
tower-http = { version = "0.6", features = ["trace", "cors"] }

tonic = "0.12"
prost = "0.13"

async-graphql = "7"
async-graphql-axum = "7"

quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"

tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
cucumber = "0.21"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[[test]]
name = "health_steps"
harness = false

[[test]]
name = "rest_get_steps"
harness = false

[[test]]
name = "soap_acknowledgement_steps"
harness = false

[[test]]
name = "graphql_query_steps"
harness = false

[[test]]
name = "grpc_hello_steps"
harness = false


